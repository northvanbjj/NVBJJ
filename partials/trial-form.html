<div class="form-wrap">
  <div class="form-msg success" role="status">Thanks! We'll be in touch shortly to schedule your free trial.</div>
  <div class="form-msg error" role="alert"></div>
  <form id="trial-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <div class="form-hp" aria-hidden="true">
      <label for="hp-field">Please leave this field empty</label>
      <input type="text" id="hp-field" name="_gotcha" tabindex="-1" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="name">Name *</label>
      <input type="text" id="name" name="name" required autocomplete="name">
    </div>
    <div class="form-group">
      <label for="child-name">Child's Name (if registering your child)</label>
      <input type="text" id="child-name" name="child_name" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="phone">Phone *</label>
      <input type="tel" id="phone" name="phone" required autocomplete="tel">
    </div>
    <div class="form-group">
      <label for="age">Age</label>
      <input type="text" id="age" name="age" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="experience">What's your experience level?</label>
      <select id="experience" name="experience">
        <option value="">Select one</option>
        <option value="None">None</option>
        <option value="Beginner (less than 6 months)">Beginner (less than 6 months)</option>
        <option value="Intermediate (6 months to 1 year)">Intermediate (6 months to 1 year)</option>
        <option value="Advanced (1 year or more)">Advanced (1 year or more)</option>
        <option value="Blue Belt +">Blue Belt +</option>
      </select>
    </div>
    <div class="form-group">
      <label for="referral">How did you hear about us?</label>
      <select id="referral" name="referral">
        <option value="">Select one</option>
        <option value="Internet search">Internet search</option>
        <option value="Friend suggestion">Friend suggestion</option>
        <option value="Saw a poster">Saw a poster</option>
        <option value="Walked by">Walked by</option>
        <option value="Instagram">Instagram</option>
        <option value="Facebook">Facebook</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label for="referral-other">If other:</label>
      <input type="text" id="referral-other" name="referral_other" autocomplete="off">
    </div>
    <button type="submit" class="btn btn-primary btn-full">Book My Free Trial</button>
  </form>
</div>
